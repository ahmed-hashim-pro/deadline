<text x="620.4" y="211.0" font-size="11" text-anchor="middle" fill="#57606a">6 s</text>
<line x1="707.8" y1="102.0" x2="707.8" y2="197.0" stroke="#d8dee4"/>
<text x="707.8" y="211.0" font-size="11" text-anchor="middle" fill="#57606a">7 s</text>
