<text x="970.0" y="211.0" font-size="11" text-anchor="middle" fill="#57606a">10 s</text>
<rect x="270.8" y="102.0" width="699.2" height="95.0" fill="#f6f8fa"/>
<text x="24" y="78.0" font-size="13.5" font-weight="600" fill="#24292f">Without deadlines: every hop's timeouts and retries are its own</text>
<text x="86.0" y="119.0" font-size="12.5" font-weight="600" text-anchor="end" fill="#24292f">gateway</text>
<rect x="96.1" y="108.0" width="174.71" height="14.0" fill="#2a78d6"/>
<rect x="270.8" y="108.0" width="624.74" height="14.0" fill="#cf222e"/>
