<text x="707.8" y="373.0" font-size="11" text-anchor="middle" fill="#57606a">7 s</text>
<line x1="795.2" y1="283.0" x2="795.2" y2="359.0" stroke="#d8dee4"/>
<text x="795.2" y="373.0" font-size="11" text-anchor="middle" fill="#57606a">8 s</text>
<line x1="882.6" y1="283.0" x2="882.6" y2="359.0" stroke="#d8dee4"/>
