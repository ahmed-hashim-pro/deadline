<text x="275.8" y="99.0" font-size="11.5" fill="#24292f">user gave up at 2.00 s</text>
<text x="970.0" y="227.0" font-size="11.5" text-anchor="end" fill="#cf222e">services busy until 9.61 s · 11.1 s of worker time after the user stopped waiting</text>
<line x1="96.0" y1="283.0" x2="96.0" y2="359.0" stroke="#d8dee4"/>
<text x="96.0" y="373.0" font-size="11" text-anchor="middle" fill="#57606a">0 s</text>
