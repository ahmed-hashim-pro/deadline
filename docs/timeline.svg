<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="471" viewBox="0 0 1000 471" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="24" y="30" font-size="17" font-weight="600" fill="#24292f">One slow request, user → gateway → orders → inventory</text>
<text x="24" y="50" font-size="12.5" fill="#57606a">Same services, same timeouts and retries. Inventory takes 1.5 s; orders waits 1.0 s for it, three times; gateway waits 3.5 s for orders, three times.</text>
