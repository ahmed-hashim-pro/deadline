<rect x="258.7" y="283.0" width="711.3" height="76.0" fill="#f6f8fa"/>
<text x="24" y="259.0" font-size="13.5" font-weight="600" fill="#24292f">With deadlines: each hop is told what's left of the user's 2 s</text>
<text x="86.0" y="300.0" font-size="12.5" font-weight="600" text-anchor="end" fill="#24292f">gateway</text>
<rect x="96.4" y="289.0" width="162.13" height="14.0" fill="#2a78d6"/>
<text x="86.0" y="326.0" font-size="12.5" font-weight="600" text-anchor="end" fill="#24292f">orders</text>
