<line x1="258.7" y1="273.0" x2="258.7" y2="359.0" stroke="#24292f" stroke-width="1.5" stroke-dasharray="5 3"/>
<text x="263.7" y="280.0" font-size="11.5" fill="#24292f">user got 504 at 1.86 s</text>
<text x="970.0" y="389.0" font-size="11.5" text-anchor="end" fill="#57606a">services busy until 1.86 s · 0.0 s of worker time after the user stopped waiting</text>
